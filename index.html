<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="What I eat, and how it makes me feel.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PS Health</title>
<meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 class="logo">PS <span>Health</span></h1>
    <p id="sub" class="sub"></p>
  </div>
  <button id="theme" class="icon-btn" aria-label="Toggle light or dark mode">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
  </button>
</header>

<main id="app">
  <p class="empty">Loading…</p>
</main>

<nav id="tabs" class="bottom-nav" hidden>
  <button data-tab="today" aria-label="Today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span>
  </button>
  <button data-tab="foods" aria-label="My foods">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v7a3 3 0 0 0 3 3v6M8 4v6M11 4v7a3 3 0 0 1-3 3M17 20V4c-2 1-3 3.5-3 7h3"/></svg><span>Foods</span>
  </button>
  <button data-tab="insights" aria-label="Insights">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 16v-5M12 16V7M17 16v-8"/></svg><span>Insights</span><i class="dot" hidden></i>
  </button>
  <button data-tab="you" aria-label="You">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5c1-3.5 4-5 7.5-5s6.5 1.5 7.5 5"/></svg><span>You</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="sheet-x" data-close aria-label="Close">×</button>
    <div id="sheet-body"></div>
  </div>
</div>

<input id="camera" type="file" accept="image/*" capture="environment" hidden>
<input id="gallery" type="file" accept="image/*" hidden>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js?v=1"></script>
</body>
</html>
